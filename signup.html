<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        /* ====================================
           Sign Up Form - Stylesheet
           ==================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary-color: #f3f4f6;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --error-color: #dc2626;
            --success-color: #16a34a;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            padding: 20px 0;
        }

        /* Container & Wrapper */
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .form-wrapper {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Form Header */
        .form-header {
            padding: 40px 32px 20px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .form-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Form Content */
        .sign-up-form {
            padding: 32px;
        }

        /* Form Row (Two Columns) */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--secondary-color);
            color: var(--text-primary);
            transition: var(--transition);
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-group input::placeholder {
            color: var(--text-secondary);
        }

        /* Password Wrapper */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 44px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: var(--text-secondary);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: var(--primary-color);
        }

        .eye-icon {
            width: 20px;
            height: 20px;
        }

        /* Error Message */
        .error-message {
            display: block;
            font-size: 13px;
            color: var(--error-color);
            margin-top: 6px;
            min-height: 18px;
        }

        /* Success Message */
        .success-message {
            display: none;
            font-size: 13px;
            color: var(--success-color);
            margin-top: 6px;
        }

        /* Terms & Conditions */
        .checkbox-label {
            display: flex;
            align-items: flex-start;
            cursor: pointer;
            user-select: none;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: var(--primary-color);
            flex-shrink: 0;
        }

        .checkbox-label a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .checkbox-label a:hover {
            text-decoration: underline;
        }

        /* Buttons */
        .btn-primary,
        .btn-secondary {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, #1d4ed8 100%);
            color: white;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-hover) 0%, #164ba8 100%);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--secondary-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            margin-top: 16px;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
            border-color: var(--text-secondary);
        }

        .btn-secondary:active {
            background: #d1d5db;
        }

        /* Google Icon */
        .google-icon {
            width: 20px;
            height: 20px;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            padding: 0 12px;
        }

        /* Form Footer */
        .form-footer {
            padding: 0 32px 32px;
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .form-footer a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 640px) {
            .container {
                padding: 16px;
            }

            .form-wrapper {
                border-radius: 8px;
            }

            .form-header {
                padding: 32px 24px 16px;
            }

            .form-header h1 {
                font-size: 24px;
            }

            .sign-up-form {
                padding: 24px;
            }

            .form-footer {
                padding: 0 24px 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Focus Styles for Keyboard Navigation */
        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <div class="form-header">
                <h1>Create Account</h1>
                <p>Join us today and get started</p>
            </div>

            <form id="signUpForm" class="sign-up-form" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input 
                            type="text" 
                            id="firstName" 
                            name="firstName" 
                            placeholder="John" 
                            required
                        >
                        <span class="error-message" id="firstNameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input 
                            type="text" 
                            id="lastName" 
                            name="lastName" 
                            placeholder="Doe" 
                            required
                        >
                        <span class="error-message" id="lastNameError"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="you@example.com" 
                        required
                    >
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Create a strong password" 
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            placeholder="Re-enter your password" 
                            required
                        >
                        <button type="button" class="toggle-password" id="toggleConfirmPassword">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>

                <label class="checkbox-label">
                    <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
                    <span>I agree to the <a href="#" onclick="return false;">Terms & Conditions</a> and <a href="#" onclick="return false;">Privacy Policy</a></span>
                </label>

                <button type="submit" class="btn-primary">Sign Up</button>

                <div class="divider">
                    <span>or</span>
                </div>

                <button type="button" class="btn-secondary">
                    <svg class="google-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Sign up with Google
                </button>
            </form>

            <div class="form-footer">
                <p>Already have an account? <a href="index.html">Sign in</a></p>
            </div>
        </div>
    </div>

    <script>
        /* ====================================
           Sign Up Form - JavaScript Functionality
           ==================================== */

        document.addEventListener('DOMContentLoaded', function () {
            const signUpForm = document.getElementById('signUpForm');
            const firstNameInput = document.getElementById('firstName');
            const lastNameInput = document.getElementById('lastName');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const toggleConfirmPasswordBtn = document.getElementById('toggleConfirmPassword');
            const agreeTermsCheckbox = document.getElementById('agreeTerms');

            const firstNameError = document.getElementById('firstNameError');
            const lastNameError = document.getElementById('lastNameError');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');
            const confirmPasswordError = document.getElementById('confirmPasswordError');

            /* ---- Validation Functions ---- */
            const validateName = (name) => {
                return name.trim().length >= 2 && /^[a-zA-Z\s'-]+$/.test(name);
            };

            const validateEmail = (email) => {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            };

            const validatePassword = (password) => {
                return password.length >= 8;
            };

            const validatePasswordMatch = (password, confirmPassword) => {
                return password === confirmPassword;
            };

            /* ---- Password Visibility Toggle ---- */
            togglePasswordBtn.addEventListener('click', function (e) {
                e.preventDefault();
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
            });

            toggleConfirmPasswordBtn.addEventListener('click', function (e) {
                e.preventDefault();
                const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                confirmPasswordInput.setAttribute('type', type);
            });

            /* ---- First Name Validation ---- */
            firstNameInput.addEventListener('blur', function () {
                if (this.value.trim() === '') {
                    firstNameError.textContent = 'First name is required';
                } else if (!validateName(this.value)) {
                    firstNameError.textContent = 'First name must be at least 2 characters and contain only letters';
                } else {
                    firstNameError.textContent = '';
                }
            });

            firstNameInput.addEventListener('input', function () {
                if (this.value.trim() !== '' && validateName(this.value)) {
                    firstNameError.textContent = '';
                }
            });

            /* ---- Last Name Validation ---- */
            lastNameInput.addEventListener('blur', function () {
                if (this.value.trim() === '') {
                    lastNameError.textContent = 'Last name is required';
                } else if (!validateName(this.value)) {
                    lastNameError.textContent = 'Last name must be at least 2 characters and contain only letters';
                } else {
                    lastNameError.textContent = '';
                }
            });

            lastNameInput.addEventListener('input', function () {
                if (this.value.trim() !== '' && validateName(this.value)) {
                    lastNameError.textContent = '';
                }
            });

            /* ---- Email Validation ---- */
            emailInput.addEventListener('blur', function () {
                if (this.value.trim() === '') {
                    emailError.textContent = 'Email is required';
                } else if (!validateEmail(this.value)) {
                    emailError.textContent = 'Please enter a valid email address';
                } else {
                    emailError.textContent = '';
                }
            });

            emailInput.addEventListener('input', function () {
                if (this.value.trim() !== '' && validateEmail(this.value)) {
                    emailError.textContent = '';
                }
            });

            /* ---- Password Validation ---- */
            passwordInput.addEventListener('blur', function () {
                if (this.value.trim() === '') {
                    passwordError.textContent = 'Password is required';
                } else if (!validatePassword(this.value)) {
                    passwordError.textContent = 'Password must be at least 8 characters';
                } else {
                    passwordError.textContent = '';
                }
            });

            passwordInput.addEventListener('input', function () {
                if (this.value.trim() !== '' && validatePassword(this.value)) {
                    passwordError.textContent = '';
                }
            });

            /* ---- Confirm Password Validation ---- */
            confirmPasswordInput.addEventListener('blur', function () {
                if (this.value.trim() === '') {
                    confirmPasswordError.textContent = 'Please confirm your password';
                } else if (!validatePasswordMatch(passwordInput.value, this.value)) {
                    confirmPasswordError.textContent = 'Passwords do not match';
                } else {
                    confirmPasswordError.textContent = '';
                }
            });

            confirmPasswordInput.addEventListener('input', function () {
                if (this.value.trim() !== '' && validatePasswordMatch(passwordInput.value, this.value)) {
                    confirmPasswordError.textContent = '';
                }
            });

            /* ---- Form Submission ---- */
            signUpForm.addEventListener('submit', function (e) {
                e.preventDefault();

                // Clear previous errors
                firstNameError.textContent = '';
                lastNameError.textContent = '';
                emailError.textContent = '';
                passwordError.textContent = '';
                confirmPasswordError.textContent = '';

                let isValid = true;

                // Validate all fields
                if (firstNameInput.value.trim() === '') {
                    firstNameError.textContent = 'First name is required';
                    isValid = false;
                } else if (!validateName(firstNameInput.value)) {
                    firstNameError.textContent = 'First name must be at least 2 characters and contain only letters';
                    isValid = false;
                }

                if (lastNameInput.value.trim() === '') {
                    lastNameError.textContent = 'Last name is required';
                    isValid = false;
                } else if (!validateName(lastNameInput.value)) {
                    lastNameError.textContent = 'Last name must be at least 2 characters and contain only letters';
                    isValid = false;
                }

                if (emailInput.value.trim() === '') {
                    emailError.textContent = 'Email is required';
                    isValid = false;
                } else if (!validateEmail(emailInput.value)) {
                    emailError.textContent = 'Please enter a valid email address';
                    isValid = false;
                }

                if (passwordInput.value.trim() === '') {
                    passwordError.textContent = 'Password is required';
                    isValid = false;
                } else if (!validatePassword(passwordInput.value)) {
                    passwordError.textContent = 'Password must be at least 8 characters';
                    isValid = false;
                }

                if (confirmPasswordInput.value.trim() === '') {
                    confirmPasswordError.textContent = 'Please confirm your password';
                    isValid = false;
                } else if (!validatePasswordMatch(passwordInput.value, confirmPasswordInput.value)) {
                    confirmPasswordError.textContent = 'Passwords do not match';
                    isValid = false;
                }

                if (!agreeTermsCheckbox.checked) {
                    alert('Please agree to the Terms & Conditions');
                    isValid = false;
                }

                if (isValid) {
                    const formData = new FormData(signUpForm);
                    const data = {
                        firstName: formData.get('firstName'),
                        lastName: formData.get('lastName'),
                        email: formData.get('email'),
                        password: formData.get('password'),
                        agreeTerms: agreeTermsCheckbox.checked,
                    };

                    console.log('Form submitted successfully:', data);
                    // Handle form submission here (e.g., send to server)
                    // alert('Sign up successful!');
                }
            });

            /* ---- Google Sign-Up Button ---- */
            const googleBtn = document.querySelector('.btn-secondary');
            googleBtn.addEventListener('click', function (e) {
                e.preventDefault();
                console.log('Google Sign-Up clicked');
                // Integrate with Google OAuth here
            });

            /* ---- Sign In Link ---- */
            const signInLink = document.querySelector('.form-footer a');
            signInLink.addEventListener('click', function (e) {
                e.preventDefault();
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
